# golangci-lint v1 config. Requires a golangci-lint binary built with
# Go >= 1.26 (module toolchain); rebuild via:
#   GOTOOLCHAIN=go1.26.4 go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
run:
  go: "1.26"
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gocyclo
    - misspell
    - forbidigo
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - goimports
    - gosec
    - errorlint
    - unconvert
    - copyloopvar
    - intrange
    - nolintlint
    - unparam
    - gocritic

linters-settings:
  gocyclo:
    min-complexity: 25
  errcheck:
    # cmd/* and internal/ui print to stdout/stderr as their primary purpose;
    # checking every Print error return there is noise, not a bug class.
    exclude-functions:
      - fmt.Println
      - fmt.Printf
      - fmt.Print
  forbidigo:
    forbid:
      - 'fmt\.Print.*'
  gosec:
    excludes:
      # G115 (integer conversion overflow): the transposition table, Zobrist
      # hashing, magic bitboards and eval pack values into narrower integers on
      # purpose, and each conversion is range-bounded by construction.
      - G115

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: ^cmd/
      linters:
        - forbidigo
    - path: ^internal/ui/
      linters:
        - forbidigo
    # Tests use fixed-seed math/rand for reproducible playouts (G404), read and
    # write fixtures by path (G304), and name constants like enPassantFEN, which
    # G101 mistakes for credentials.
    - path: _test\.go$
      linters:
        - gosec
      text: "G(101|304|404)"
    # The SPRT runner streams the match engine's output to the terminal.
    - path: ^internal/bench/
      linters:
        - forbidigo
